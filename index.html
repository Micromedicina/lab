<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under construction</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #070812;
      color: #ffffff;
    }

    .background {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 25%, rgba(72, 111, 255, 0.28), transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(255, 75, 190, 0.22), transparent 30%),
        radial-gradient(circle at 55% 85%, rgba(0, 214, 255, 0.16), transparent 35%),
        #070812;
      z-index: -3;
    }

    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: radial-gradient(circle at center, black, transparent 72%);
      z-index: -2;
    }

    .orb {
      position: fixed;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      filter: blur(36px);
      opacity: 0.55;
      z-index: -1;
      animation: float 7s ease-in-out infinite;
    }

    .orb.one {
      left: 8%;
      top: 18%;
      background: #38bdf8;
    }

    .orb.two {
      right: 8%;
      bottom: 14%;
      background: #d946ef;
      animation-delay: -3s;
    }

    .card {
      width: min(92vw, 900px);
      padding: clamp(48px, 9vw, 96px) clamp(28px, 7vw, 88px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.065);
      box-shadow: 0 35px 100px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      text-align: center;
      animation: enter 900ms ease both;
    }

    h1 {
      font-size: clamp(48px, 11vw, 50px);
      line-height: 0.92;
      letter-spacing: -0.075em;
      font-weight: 900;
      text-transform: uppercase;
      background: linear-gradient(90deg, #67e8f9, #a5b4fc, #f0abfc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: glow 4s ease-in-out infinite;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-28px) scale(1.08);
      }
    }

    @keyframes glow {
      0%, 100% {
        filter: drop-shadow(0 0 18px rgba(103, 232, 249, 0.22));
      }
      50% {
        filter: drop-shadow(0 0 32px rgba(240, 171, 252, 0.35));
      }
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="grid"></div>
  <div class="orb one"></div>
  <div class="orb two"></div>

  <main class="card">
    <h1>Under construction</h1>
  </main>
</body>
</html>
